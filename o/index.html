<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>une. — offrir une pellicule</title>
  <meta name="robots" content="noindex" />
  <!-- Page relais du QR code imprimé (« offrir une pellicule »). Rôle :
       1) tenter d'ouvrir l'app via le scheme une://offrir (ceux qui l'ont
          installée tombent directement sur le tunnel « offrir » du tiroir
          cadeaux) ;
       2) fallback provisoire : rediriger vers /cadeau.html (achat cadeau sur
          le web) si l'app ne s'ouvre pas — en attendant que la fiche App
          Store soit publiée.
       Hébergement statique (GitHub Pages) : tout se joue côté client.
       Quand l'URL App Store sera dispo, remplacer APP_STORE_URL ci-dessous
       et le fallback deviendra un choix « télécharger l'app » / « acheter
       sur le web ». -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:     #161412;
      --ink-2:   #3d3935;
      --slate:   #6b645c;
      --voile:   #9a958c;
      --paper:   #f1ece4;
      --paper-2: #e8e2d6;
      --rule:    #d9d3c7;
      --serif: "Cormorant Garamond", Georgia, serif;
      --display: "Fraunces", Georgia, serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    ::selection { background: var(--ink); color: var(--paper); }
    main { width: 100%; max-width: 420px; text-align: center; }
    .wordmark {
      font-family: var(--display);
      font-weight: 400;
      font-size: 28px;
      letter-spacing: -0.02em;
      margin-bottom: 40px;
    }
    .kicker {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: lowercase;
      color: var(--voile);
      margin-bottom: 12px;
    }
    h1 {
      font-family: var(--display);
      font-weight: 300;
      font-size: 40px;
      line-height: 1.02;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
    }
    .lede {
      font-style: italic;
      font-weight: 300;
      font-size: 18px;
      color: var(--ink-2);
      margin-bottom: 30px;
    }
    .btn {
      display: block;
      width: 100%;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      text-align: center;
      text-decoration: none;
      border: 0;
      padding: 17px 20px;
      cursor: pointer;
      margin-bottom: 14px;
    }
    .btn:active { opacity: 0.75; }
    .btn.ghost {
      background: none;
      color: var(--ink);
      border: 1px solid var(--ink);
    }
    .hint {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: lowercase;
      color: var(--voile);
      margin-top: 22px;
    }
    footer {
      margin-top: 56px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--voile);
      text-transform: lowercase;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <div class="wordmark">une.</div>
    <div class="kicker">offrir</div>
    <h1>offrir<br>une pellicule.</h1>
    <p class="lede">une pellicule numérique à offrir : un colis de tirages physiques et un code à révéler.</p>

    <button class="btn" id="openBtn">ouvrir dans l'app</button>
    <a class="btn ghost" id="webBtn" href="/cadeau.html">acheter sur le web</a>

    <p class="hint" id="hint">redirection dans un instant…</p>

    <footer>une seule prise. une seule chance. une seule photo.</footer>
  </main>

  <script>
    // TODO (publication App Store) : renseigner l'URL réelle de la fiche,
    // ex. https://apps.apple.com/fr/app/une/id0000000000
    // Une fois renseignée, le fallback affichera « télécharger l'app » au
    // lieu de rediriger vers /cadeau.html.
    // ⚠️ Miroir : même variable dans /index.html (mettre à jour aux deux endroits).
    var APP_STORE_URL = "";

    var DEEP_LINK = "une://offrir";
    var WEB_FALLBACK = "/cadeau.html";
    // ~1,4 s : assez pour laisser l'app s'ouvrir (document.hidden bascule à
    // true côté iOS), pas trop long pour ceux qui ne l'ont pas.
    var FALLBACK_DELAY_MS = 1400;

    var openBtn = document.getElementById("openBtn");
    var webBtn = document.getElementById("webBtn");
    var hint = document.getElementById("hint");

    function goToFallback() {
      if (document.hidden) return;  // app ouverte → on ne bouge pas
      if (APP_STORE_URL) {
        location.replace(APP_STORE_URL);
      } else {
        location.replace(WEB_FALLBACK);
      }
    }

    function tryOpenApp() {
      // Le clic utilisateur permet à Safari d'ouvrir le scheme sans alerte.
      location.href = DEEP_LINK;
      setTimeout(goToFallback, FALLBACK_DELAY_MS);
    }

    openBtn.addEventListener("click", tryOpenApp);

    // Auto-tentative au chargement : la plupart des Safari récents acceptent
    // location.href vers un scheme custom même sans geste, silencieusement si
    // l'app est absente. Si l'app est présente, elle s'ouvre → document.hidden
    // devient true → la redirection fallback ne se déclenche pas.
    window.addEventListener("load", function () {
      // Micro-délai pour laisser la page peindre avant de tenter le scheme
      // (évite un flash blanc sur Safari).
      setTimeout(function () {
        location.href = DEEP_LINK;
        setTimeout(goToFallback, FALLBACK_DELAY_MS);
      }, 120);
    });
  </script>
</body>
</html>
