<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>une. · offrir une pellicule</title>
  <meta name="robots" content="noindex" />
  <!-- Page relais du QR code imprimé (« offrir une pellicule »). Rôle :
       1) tenter d'ouvrir l'app via le scheme une://offrir (ceux qui l'ont
          installée tombent directement sur le tunnel « offrir » du tiroir
          cadeaux) ;
       2) fallback store adapté à l'OS si l'app ne s'ouvre pas, avec achat web
          toujours disponible en second choix.
       Hébergement statique (GitHub Pages) : tout se joue côté client. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:     #161412;
      --ink-2:   #3d3935;
      --slate:   #6b645c;
      --voile:   #9a958c;
      --paper:   #f1ece4;
      --paper-2: #e8e2d6;
      --rule:    #d9d3c7;
      --serif: "Cormorant Garamond", Georgia, serif;
      --display: "Fraunces", Georgia, serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    ::selection { background: var(--ink); color: var(--paper); }
    main { width: 100%; max-width: 420px; text-align: center; }
    .wordmark {
      font-family: var(--display);
      font-weight: 400;
      font-size: 28px;
      letter-spacing: -0.02em;
      margin-bottom: 40px;
    }
    .kicker {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: lowercase;
      color: var(--voile);
      margin-bottom: 12px;
    }
    h1 {
      font-family: var(--display);
      font-weight: 300;
      font-size: 40px;
      line-height: 1.02;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
    }
    .lede {
      font-style: italic;
      font-weight: 300;
      font-size: 18px;
      color: var(--ink-2);
      margin-bottom: 30px;
    }
    .btn {
      display: block;
      width: 100%;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      text-align: center;
      text-decoration: none;
      border: 0;
      padding: 17px 20px;
      cursor: pointer;
      margin-bottom: 14px;
    }
    .btn:active { opacity: 0.75; }
    .btn.ghost {
      background: none;
      color: var(--ink);
      border: 1px solid var(--ink);
    }
    .hint {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: lowercase;
      color: var(--voile);
      margin-top: 22px;
    }
    footer {
      margin-top: 56px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--voile);
      text-transform: lowercase;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <div class="wordmark">une.</div>
    <div class="kicker">offrir</div>
    <h1>offrir<br>une pellicule.</h1>
    <p class="lede">une pellicule numérique à offrir : un colis de tirages physiques et un code à révéler.</p>

    <button class="btn" id="openBtn">ouvrir dans l'app</button>
    <a class="btn ghost" id="webBtn" href="/cadeau.html">acheter sur le web</a>

    <p class="hint" id="hint">appuie pour ouvrir l'app.</p>

    <footer>une seule prise. une seule chance. une seule photo.</footer>
  </main>

  <script>
    var APP_STORE_URL = "https://apps.apple.com/fr/app/une-app-photo-unique/id6788447263";
    var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.une.app";

    var DEEP_LINK = "une://offrir";
    var WEB_FALLBACK = "/cadeau.html";
    var QR_CODE = "photo_card_film_code_v1";
    var SCAN_ID = fallbackUuid();
    // ~1,4 s : assez pour laisser l'app s'ouvrir (document.hidden bascule à
    // true côté iOS), pas trop long pour ceux qui ne l'ont pas.
    var FALLBACK_DELAY_MS = 1400;

    var openBtn = document.getElementById("openBtn");
    var webBtn = document.getElementById("webBtn");
    var hint = document.getElementById("hint");

    function apiBase() {
      if (["localhost", "127.0.0.1"].includes(location.hostname)) return "http://localhost:3000";
      return "https://api.une-app.fr";
    }

    function anonymousId() {
      try {
        var key = "une.qr.anonymousId";
        var existing = window.localStorage && localStorage.getItem(key);
        if (existing) return existing;
        var id = window.crypto && crypto.randomUUID ? crypto.randomUUID() : fallbackUuid();
        if (window.localStorage) localStorage.setItem(key, id);
        return id;
      } catch (_) {
        return null;
      }
    }

    function fallbackUuid() {
      return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, function (c) {
        return (Number(c) ^ Math.random() * 16 >> Number(c) / 4).toString(16);
      });
    }

    function deviceType() {
      var ua = navigator.userAgent || "";
      if (/bot|crawl|spider/i.test(ua)) return "bot";
      if (/ipad|tablet/i.test(ua)) return "tablet";
      if (/mobi|iphone|android/i.test(ua)) return "mobile";
      return "desktop";
    }

    function osName() {
      var ua = navigator.userAgent || "";
      if (/iphone|ipad|ios/i.test(ua)) return "iOS";
      if (/android/i.test(ua)) return "Android";
      if (/mac os/i.test(ua)) return "macOS";
      if (/windows/i.test(ua)) return "Windows";
      return "inconnu";
    }

    function browserName() {
      var ua = navigator.userAgent || "";
      if (/CriOS|Chrome/i.test(ua) && !/Edg/i.test(ua)) return "Chrome";
      if (/Safari/i.test(ua) && !/Chrome|CriOS/i.test(ua)) return "Safari";
      if (/Firefox/i.test(ua)) return "Firefox";
      if (/Edg/i.test(ua)) return "Edge";
      return "inconnu";
    }

    function storeUrl() {
      var ua = navigator.userAgent || "";
      if (/android/i.test(ua) && PLAY_STORE_URL) return PLAY_STORE_URL;
      if (APP_STORE_URL) return APP_STORE_URL;
      return "";
    }

    function sendQrWithBeacon(body) {
      if (!navigator.sendBeacon) return false;
      var blob = new Blob([body], { type: "application/json" });
      return navigator.sendBeacon(apiBase() + "/api/v1/marketing/qr-scans", blob);
    }

    function sendQrWithFetch(body) {
      if (!window.fetch) return Promise.resolve(false);
      return fetch(apiBase() + "/api/v1/marketing/qr-scans", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: body,
        keepalive: true
      }).then(function () {
        return true;
      }).catch(function () {
        return false;
      });
    }

    function waitMs(ms) {
      return new Promise(function (resolve) {
        setTimeout(function () { resolve(false); }, ms);
      });
    }

    function trackQr(action, destination, options) {
      options = options || {};
      var payload = {
        qr_code: QR_CODE,
        action: action,
        scan_id: SCAN_ID,
        anonymous_id: anonymousId(),
        destination: destination || null,
        page_path: location.pathname,
        referrer: document.referrer || null,
        user_agent: (navigator.userAgent || "").slice(0, 512),
        device_type: deviceType(),
        os: osName(),
        browser: browserName(),
        language: navigator.language || null,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null,
        screen_width: screen && screen.width ? screen.width : null,
        screen_height: screen && screen.height ? screen.height : null
      };
      try {
        var body = JSON.stringify(payload);
        if (options.wait && window.Promise) {
          return Promise.race([
            sendQrWithFetch(body),
            waitMs(options.timeoutMs || 450)
          ]).then(function (sent) {
            if (!sent) sendQrWithBeacon(body);
            return sent;
          });
        }
        if (!sendQrWithBeacon(body)) sendQrWithFetch(body);
      } catch (_) {}
      return Promise.resolve(false);
    }

    function goToFallback() {
      if (document.hidden) return;  // app ouverte → on ne bouge pas
      var fallbackStoreUrl = storeUrl();
      if (fallbackStoreUrl) {
        trackQr("app_store_fallback", "app_store");
        location.replace(fallbackStoreUrl);
      } else {
        location.replace(WEB_FALLBACK);
      }
    }

    function tryOpenApp() {
      var url = new URL(apiBase() + "/api/v1/marketing/qr-open");
      url.searchParams.set("qr_code", QR_CODE);
      url.searchParams.set("scan_id", SCAN_ID);
      var aid = anonymousId();
      if (aid) url.searchParams.set("anonymous_id", aid);
      url.searchParams.set("page_path", location.pathname);
      location.href = url.toString();
    }

    openBtn.addEventListener("click", tryOpenApp);
    webBtn.addEventListener("click", function () {
      trackQr("web_fallback_clicked", "web_gift");
    });

    window.addEventListener("load", function () {
      trackQr("page_loaded", "app", { wait: true, timeoutMs: 500 });
    });
  </script>
</body>
</html>
