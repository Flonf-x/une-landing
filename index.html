<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>une. bientôt de retour</title>
  <meta name="description" content="une. fait une courte pause. la page rouvrira bientôt." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://une-app.fr/" />
  <meta property="og:title" content="une. bientôt de retour" />
  <meta property="og:description" content="une. fait une courte pause. la page rouvrira bientôt." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://une-app.fr/" />
  <meta property="og:image" content="https://une-app.fr/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:#161412; --ink-2:#3d3935; --slate:#5a554f; --voile:#8a8278;
      --rule:#c9c2b5; --paper-2:#e8e2d6; --paper:#f1ece4;
      --display:'Fraunces','GT Sectra Display',Georgia,serif;
      --serif:'Cormorant Garamond','Garamond',Georgia,serif;
      --mono:'JetBrains Mono',ui-monospace,monospace;
      --pad-x:clamp(20px,5vw,64px); --track-mono:0.18em;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
    body {
      min-height:100svh; background:var(--paper); color:var(--ink);
      font-family:var(--serif); font-size:18px; line-height:1.6;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:clamp(48px,10vw,96px) var(--pad-x); gap:clamp(28px,5vw,44px);
    }
    ::selection { background:var(--ink); color:var(--paper); }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
    .mark { font-family:var(--display); font-weight:300; letter-spacing:-0.05em; font-size:clamp(52px,12vw,104px); line-height:1; }
    .mark .dot { color:var(--voile); }
    .label {
      font-family:var(--mono); font-size:11px; letter-spacing:var(--track-mono);
      text-transform:lowercase; color:var(--slate);
      display:inline-flex; align-items:center; gap:0.7em;
    }
    .label::before,.label::after { content:""; width:clamp(24px,8vw,56px); height:1px; background:var(--rule); }
    .lede { font-family:var(--display); font-weight:300; letter-spacing:-0.035em; line-height:1.08; font-size:clamp(28px,5.2vw,52px); max-width:16ch; }
    .lede .italic { font-family:var(--serif); font-style:italic; font-weight:300; }
    .note { font-family:var(--serif); font-size:clamp(17px,2.4vw,21px); color:var(--ink-2); max-width:34ch; }
  </style>
</head>
<body>
  <div class="mark">une<span class="dot">.</span></div>
  <span class="label">bientôt de retour</span>
  <h1 class="lede">nous faisons une <span class="italic">pause</span>.</h1>
  <p class="note">la page se repose un instant. elle rouvrira bientôt. reviens dans quelques jours.</p>
</body>
</html>
